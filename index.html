<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacker Technology Background</title>
    <style>
        /* Basic Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body Style with Matrix Background */
        body {
            background-color: #000; /* Fallback */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden; /* To prevent scrollbars with the animation */
            position: relative;
        }

        /* Matrix Code Background Animation */
        canvas#matrix-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; /* Puts the canvas behind everything */
            opacity: 0.7; /* Slightly transparent for better text readability */
        }

        /* Content Box Style */
        .content-box {
            background: rgba(0, 20, 0, 0.8); /* Semi-transparent dark green background */
            border: 2px solid #0f0; /* Bright green border */
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5); /* Green glow effect */
            color: #0f0; /* Green text */
            max-width: 600px;
            width: 90%;
            animation: glitch 1s infinite; /* Optional glitch effect */
        }

        .content-box h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            text-transform: uppercase;
            text-shadow: 2px 2px 4px #000;
        }

        .content-box p {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn-hacker {
            background-color: #0f0;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s, box-shadow 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-hacker:hover {
            background-color: #fff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.7);
        }

        /* Glitch Animation Keyframes */
        @keyframes glitch {
            2%, 64% {
                transform: translate(2px, 0) skew(0deg);
            }
            4%, 60% {
                transform: translate(-2px, 0) skew(0deg);
            }
            62% {
                transform: translate(0, 0) skew(5deg);
            }
        }
    </style>
</head>
<body>

    <!-- Matrix Background Canvas -->
    <canvas id="matrix-bg"></canvas>

    <!-- Content Box -->
    <div class="content-box">
        <h1>System Access Granted</h1>
        <p>Welcome, User. You have successfully breached the firewall. The mainframe is now accessible. Proceed with caution.</p>
        <a href="#" class="btn-hacker">Initialize Protocol</a>
    </div>

    <!-- JavaScript for Matrix Animation -->
    <script>
        const canvas = document.getElementById('matrix-bg');
        const ctx = canvas.getContext('2d');

        // Set canvas size to full window
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Characters to use (katakana, numbers, latin alphabet)
        const katakana = 'アカサタナハマヤラワキシチニヒミリヰウクスツヌフムユルヱエケセテネヘメレヲゴザダバヂヅデドビピヴゲゼデベペゾドボプヴ';
        const latin = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const nums = '0123456789';
        const alphabet = katakana + latin + nums;

        const fontSize = 16;
        const columns = canvas.width / fontSize; // Number of columns for the rain

        // An array of drops - one per column
        const drops = [];
        for (let x = 0; x < columns; x++) {
            drops[x] = 1; // Initial y coordinate for each drop
        }

        // Drawing the characters
        function draw() {
            // Black background for the canvas with a low opacity to create a fade effect
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#0F0'; // Green text color
            ctx.font = fontSize + 'px monospace';

            // Loop over each drop
            for (let i = 0; i < drops.length; i++) {
                // Print a random character
                const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
                // x = i*fontSize, y = drops[i]*fontSize
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                // Sending the drop back to the top randomly after it has crossed the screen
                // Adding a randomness to the drop reset to make the rain look more organic
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }

                // Incrementing Y coordinate
                drops[i]++;
            }
        }

        // Run the draw function every 33ms
        setInterval(draw, 33);

        // Resize event listener to handle window resizing
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            // Reset drops array on resize
            for (let x = 0; x < columns; x++) {
                drops[x] = 1;
            }
        });
    </script>
</body>
</html>
