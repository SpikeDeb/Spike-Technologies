<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spike Technologies — Coming Soon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            background-image: radial-gradient(circle at center, #111e38 0%, #0b0f19 70%);
            padding: 20px;
        }
        .container {
            max-width: 100%;
            width: 100%;
            padding: 10px;
        }
        .quote {
            font-size: 1.1rem;
            color: #94a3b8;
            font-style: italic;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        h1 {
            font-size: 2.2rem;
            color: #00f0ff;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
            word-break: break-word;
        }
        .founder {
            font-size: 0.9rem;
            color: #64748b;
            letter-spacing: 1px;
            margin-bottom: 30px;
            text-transform: uppercase;
        }
        .status {
            display: inline-block;
            padding: 10px 24px;
            border: 2px solid #00f0ff;
            color: #00f0ff;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 30px;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="quote">"They called it impossible. I called it my mission."</div>
        <h1>Spike Technologies</h1>
        <div class="founder">Founder: Debjit Das</div>
        <div class="status">Coming Soon ⚡</div>
    </div>

</body>
</html>
