<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spike Technologies - Coming Soon</title>
    <style>
        /* Basic Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body Style with Matrix Background */
        body {
            background-color: #000;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            position: relative;
        }

        /* Matrix Code Background Animation */
        canvas#matrix-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.6;
        }

        /* Content Box Style */
        .content-box {
            background: rgba(0, 15, 0, 0.85);
            border: 2px solid #0f0;
            border-radius: 12px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 0 25px rgba(0, 255, 0, 0.4);
            color: #0f0;
            max-width: 600px;
            width: 90%;
        }

        .content-box .tagline {
            font-size: 1rem;
            color: #adfaad;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 5px;
        }

        .content-box h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.7);
        }

        .content-box h2 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        .content-box .founder {
            font-size: 1.1rem;
            color: #0f0;
            margin-bottom: 20px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .content-box p {
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 30px;
            color: #adfaad;
        }

        .btn-hacker {
            background-color: #0f0;
            color: #000;
            border: none;
            padding: 12px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }

        .btn-hacker:hover {
            background-color: #fff;
            color: #000;
            box-shadow: 0 0 20px #fff;
        }
    </style>
</head>
<body>

    <!-- Matrix Background Canvas -->
    <canvas id="matrix-bg"></canvas>

    <!-- Content Box -->
    <div class="content-box">
        <div class="tagline">Next-Gen Innovation</div>
        <h1>Spike Technologies</h1>
        <h2>Coming Soon</h2>
        <div class="founder">Founder: Debjit Das</div>
        <p>We are engineering something extraordinary. Our digital mainframe is currently under development. Stay tuned for the launch.</p>
        <a href="#" class="btn-hacker">Notify Me</a>
    </div>

    <!-- JavaScript for Matrix Animation -->
    <script>
        const canvas = document.getElementById('matrix-bg');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const katakana = 'アカサタナハマヤラワキシチニヒミリヰウクスツヌフムユルヱエケセテネヘメレヲゴザダバヂヅデドビピヴゲゼデベペゾドボプヴ';
        const latin = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const nums = '0123456789';
        const alphabet = katakana + latin + nums;

        const fontSize = 16;
        const columns = canvas.width / fontSize;

        const drops = [];
        for (let x = 0; x < columns; x++) {
            drops[x] = 1;
        }

        function draw() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#0F0';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(draw, 33);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            for (let x = 0; x < columns; x++) {
                drops[x] = 1;
            }
        });
    </script>
</body>
</html>
