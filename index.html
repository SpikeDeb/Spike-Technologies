<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spike Technologies — Coming Soon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
            background-image: radial-gradient(circle at center, #111e38 0%, #0b0f19 70%);
        }
        .container {
            max-width: 650px;
            padding: 30px;
        }
        .quote {
            font-size: 1.25rem;
            color: #94a3b8;
            font-style: italic;
            margin-bottom: 25px;
            animation: fadeIn 2s ease-in-out;
            line-height: 1.6;
        }
        h1 {
            font-size: 3.2rem;
            color: #00f0ff;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 15px;
            text-shadow: 0 0 25px rgba(0, 240, 255, 0.4);
        }
        p {
            font-size: 1.15rem;
            color: #cbd5e1;
            letter-spacing: 1px;
            margin-bottom: 35px;
        }
        .status {
            display: inline-block;
            padding: 12px 30px;
            border: 2px solid #00f0ff;
            color: #00f0ff;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
            animation: pulse 1.5s infinite;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 15px rgba(0, 240, 255, 0.2); }
            50% { transform: scale(1.05); box-shadow: 0 0 25px rgba(0, 240, 255, 0.5); }
            100% { transform: scale(1); box-shadow: 0 0 15px rgba(0, 240, 255, 0.2); }
            }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="quote">"They said it was impossible, but I carried it in my heart all along."</div>
        <h1>Spike Technologies</h1>
        <p>The future of digital innovation is being built in silence.</p>
        <div class="status">Coming Soon ⚡</div>
    </div>

</body>
</html>
