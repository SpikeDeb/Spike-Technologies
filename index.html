<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spike Technologies — Coming Soon</title>
    <!-- Google Fonts for Luxury Editorial & Clean Tech Look -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #08090a;
            color: #f3f4f6;
            font-family: 'Plus Jakarta Sans', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Ambient Rich Background Glows */
        .ambient-glow-1 {
            position: absolute;
            top: -15%;
            left: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.08) 0%, rgba(8, 9, 10, 0) 70%);
            z-index: 0;
            pointer-events: none;
        }

        .ambient-glow-2 {
            position: absolute;
            bottom: -15%;
            right: -10%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.06) 0%, rgba(8, 9, 10, 0) 70%);
            z-index: 0;
            pointer-events: none;
        }

        /* Luxury Glass Card */
        .luxury-card {
            position: relative;
            z-index: 1;
            background: rgba(18, 20, 23, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 50px 40px;
            text-align: center;
            max-width: 620px;
            width: 90%;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .status-badge {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #d4af37; /* Rich Champagne Gold */
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.2);
            padding: 6px 16px;
            border-radius: 50px;
            margin-bottom: 20px;
        }

        .luxury-card h1 {
            font-size: 2.8rem;
            font-weight: 500;
            letter-spacing: -1px;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .luxury-card h1 span {
            font-family: 'Instrument Serif', serif;
            font-style: italic;
            font-weight: 400;
            color: #d4af37;
        }

        .founder {
            font-size: 0.9rem;
            color: #9ca3af;
            font-weight: 400;
            letter-spacing: 0.5px;
            margin-bottom: 22px;
        }

        .founder strong {
            color: #ffffff;
            font-weight: 500;
        }

        .divider {
            width: 40px;
            height: 1px;
            background: rgba(255, 255, 255, 0.15);
            margin: 0 auto 22px auto;
        }

        .luxury-card p {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #9ca3af;
            margin-bottom: 35px;
            font-weight: 300;
        }

        /* Notify Me Button with Color Change on Click */
        .btn-luxury {
            background: #ffffff;
            color: #08090a;
            border: none;
            padding: 16px 40px;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: inline-block;
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.1);
        }

        .btn-luxury:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(212, 175, 55, 0.3);
        }

        /* Active/Clicked State Color Change */
        .btn-luxury.active-state {
            background: #d4af37 !important; /* Changes to Rich Gold */
            color: #ffffff !important;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.5);
            transform: scale(0.98);
        }

        /* Responsive Design */
        @media (max-width: 580px) {
            .luxury-card {
                padding: 40px 20px;
            }
            .luxury-card h1 {
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body>

    <!-- Ambient Rich Background Lighting -->
    <div class="ambient-glow-1"></div>
    <div class="ambient-glow-2"></div>

    <!-- Main Content Card -->
    <div class="luxury-card">
        <div class="status-badge">Private Beta &bull; Coming Soon</div>
        <h1>Spike <span>Technologies</span></h1>
        <div class="founder">Founded by <strong>Debjit Das</strong></div>
        <div class="divider"></div>
        <p>We are architecting high-performance digital ecosystems and elite enterprise solutions. Excellence is currently in development.</p>
        
        <!-- Notify Me Button -->
        <button id="notifyBtn" class="btn-luxury" onclick="toggleNotify()">Notify Me</button>
    </div>

    <!-- JavaScript to Handle Color Change on Click -->
    <script>
        function toggleNotify() {
            const btn = document.getElementById('notifyBtn');
            btn.classList.toggle('active-state');
            
            if (btn.classList.contains('active-state')) {
                btn.innerText = 'Subscribed ✓';
            } else {
                btn.innerText = 'Notify Me';
            }
        }
    </script>
</body>
</html>
